<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="IA Décodée">
  <!--
    Logo de marque, référencé par le JSON-LD Organization.

    Il remplace `/logo.png`, qui était déclaré dans les données structurées mais
    renvoyait 404 en production : Google recevait donc un logo introuvable.

    Format SVG à dessein — accepté par Google pour la propriété `logo`, net à
    toute taille, et modifiable en texte sans outil graphique.
  -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#6b46ff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#fond)"/>

  <!-- Monogramme « IA » -->
  <g fill="#ffffff">
    <rect x="132" y="150" width="34" height="212" rx="17"/>
    <path d="M262 150h44l82 212h-46l-16-44h-84l-16 44h-46zm22 62-28 74h56z"/>
  </g>

  <!-- Trait lime : rappel de la couleur secondaire de la charte -->
  <rect x="132" y="386" width="248" height="14" rx="7" fill="#c6f24e"/>
</svg>
